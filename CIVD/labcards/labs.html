<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Список лабораторій</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-pip/leaflet-pip.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

  <!-- XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Стилі -->
  <style>
  body {
  font-family: Arial, sans-serif;
  margin: 0; padding: 0;
  background: linear-gradient(135deg, #006400, #004d00);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 { margin-top: 30px; }

.dashboard {
  max-width: 1200px;
  width: 95%;
  margin: 20px auto;
  padding: 20px;
  background: #008000;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.lab-card {
  background: #fff;
  color: #000;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.lab-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.lab-actions button {
  flex: 1;
  padding: 6px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.3s ease;
}

.lab-actions button:nth-child(1) { background: #009933; color: #fff; } /* редагувати */
.lab-actions button:nth-child(2) { background: #cc0000; color: #fff; } /* видалити */
.lab-actions button:nth-child(3) { background: #0066cc; color: #fff; } /* створити візит */
.lab-actions button:hover { opacity: 0.85; }

button {
  margin: 4px;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background-color: #006400;
  color: #fff;
}
button:hover { background-color: #003300; }

input, select {
  width: 96%;
  padding: 6px;
  border-radius: 4px;
  border: none;
}

.hrefs {
  text-align: center;
  margin-top: 10px;
}

#filters {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 95%;
  margin: 20px auto;
}

.filters-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
}

.filters-row label {
  flex: 1 1 20%;
  min-width: 180px;
  background: #004d00;
  padding: 6px;
  border-radius: 6px;
}

#pagination { margin-top: 20px; text-align: center; }
#pagination button { margin: 4px; }

#purchasesTable {
  width: 100%;
  border-collapse: collapse;
}
#purchasesTable th,
#purchasesTable td {
  border: 1px solid white;
  padding: 8px;
  text-align: left;
}
#purchasesTable th {
  background-color: #333;
  color: white;
}
#purchasesTable tr:hover {
  background-color: #45ff8391;
}

/* Стилі модалки */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal.show {
  display: block;
  opacity: 1;
}

.modal-content {
  background-color: #008000;
  margin: 10% auto;
  padding: 20px;
  border: 1px solid #888;
  width: 300px;
  border-radius: 8px;
  position: relative;
  transform: translateY(-30px);
  transition: transform 1s ease;
}

.modal.show .modal-content {
  transform: translateY(0);
}


/* Кнопка закриття */
.close-btn {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 24px;
  font-weight: bold;
  color: #888;
  cursor: pointer;
}
.close-btn:hover { color: #000; }


/* 📱 Адаптивність для планшетів і мобільних */
@media (max-width: 768px) {
  body {
    font-size: 18px;
    align-items: stretch;
  }

  .dashboard {
    width: 100%;
    padding: 10px;
    border-radius: 0;
  }

  .lab-card {
    margin: 12px 0;
    padding: 16px;
    font-size: 1rem;
  }

  .lab-actions {
    flex-direction: column;
  }
  .lab-actions button {
    width: 100%;
    font-size: 1rem;
    padding: 10px;
  }

  input, select {
    width: 100%;
    font-size: 1rem;
    padding: 10px;
  }

  .filters-row {
    flex-direction: column;
  }
  .filters-row label {
    min-width: unset;
    width: 100%;
    font-size: 1rem;
  }

  .modal-content {
    width: 90%;
    margin: 20% auto;
    font-size: 18px;
  }

  .close-btn {
    font-size: 28px;
  }

  .modal-content input,
  .modal-content button {
    width: 100%;
    margin-top: 10px;
    font-size: 16px;
  }
}
.switch {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  gap: 10px;
  font-family: sans-serif;
  justify-content: space-evenly;
}

.switch input {
  display: none;
}

.slider {
  position: relative;
  width: 100px;
  height: 26px;
  background-color: #ccc;
  border-radius: 26px;
  transition: background-color 0.3s;
}

.slider::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  left: 2px;
  top: 2px;
  background-color: white;
  border-radius: 50%;
  transition: transform 0.3s;
}

input:checked + .slider {
  background-color: #4caf50; /* зелений при активному стані */
}

input:checked + .slider::before {
  transform: translateX(74px);
}

.label-text {
  color: #ffffff;
  font-weight: 500;
}

  </style>
</head>
<body>
  <img src="../logo.svg" alt="logo" width="220">
  <h1 style="text-align: center;">📋 Список лабораторій</h1>

  <!-- Фільтри -->
  <section id="filters">
    <div class="filters-row">
     <label>Контактна особа (Контрагент):
      <input type="text" id="contractor" placeholder="Прізвище та ім’я">
        <datalist id="contractor"></datalist>
      </label>
      <label>
      <div id="managerFilterContainer"></div>
      </label>  
      <label>Область: 
        <input type="text" id="filterRegion" list="regionOptions">
        <datalist id="regionOptions"></datalist>
      </label>
      <label>Місто:
        <input type="text" id="filterCity" list="cityOptions">
        <datalist id="cityOptions"></datalist>
      </label>
      <label>ЛПЗ:
        <input type="text" id="filterInstitution" list="institutionOptions">
        <datalist id="institutionOptions"></datalist>
      </label>
      <label>Прилад:
        <input type="text" id="filterDevice" list="deviceOptions">
        <datalist id="deviceOptions"></datalist>
      </label>
      <label>КП:
        <input type="text" id="filterKp" list="kpOptions">
        <datalist id="kpOptions"></datalist>
      </label>
      <label>ЄДРПОУ:
        <input type="text" id="filterEdrpou" list="edrpouOptions">
        <datalist id="edrpouOptions"></datalist>
      </label>
      <label>Лабраторії: 
        <select id="filterDevices"> 
          <option value="all">Усі</option> 
          <option value="with">З приладами</option> 
          <option value="without">Без приладів</option>
        </select>
      </label>
  <label class="switch">
  <input type="checkbox" id="toggleFop" checked>
  <span class="slider"></span>
  <span class="label-text">Показувати ФОП</span>
</label>

    </div>
    <div class="hrefs">
      <button type="button" onclick="applyFilters()">🔍 Фільтрувати</button>
      <button type="button" onclick="resetFilters()">♻️ Скинути</button>
      <button onclick="exportLabsToExcel()">Експорт лабораторій</button>
      <a href="../calendar/calendar.html"><button>📅 До календаря</button></a>
      <button onclick="generateAllLabVisits()">📅 Згенерувати візити</button>
      <button type="button" onclick="createNewLab()">➕ Створити лабораторію</button>
      <a href="../index.html"><button>🏠 Назад</button></a>
    </div>
  </section>

  <!-- Контейнер для карток -->
  <div id="labsContainer" class="dashboard"></div>

  <!-- Пагінація -->
  <div id="pagination"></div>

  <!-- Модалка створення візиту -->
<div id="createVisitModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeCreateVisitModal()">×</span>
    <h3>Створення візиту</h3>
    <label for="visitDate">Дата:</label>
    <input type="date" id="visitDate">
    <div style="margin-top:10px;">
      <button onclick="confirmCreateVisit()">✅ Підтвердити</button>
      <button onclick="closeCreateVisitModal()">❌ Скасувати</button>
    </div>
  </div>
</div>


  <!-- Контейнер для мапи -->
  <div id="map" style="width:95%; height:500px; margin:20px auto; border-radius:12px;"></div>

  
  <!-- Модальне вікно для лабораторій у зоні -->
  <div id="mapModal" style="display:none; position:fixed; top:10%; left:10%; width:80%; height:70%; 
       background:#fff; color:#000; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.6); 
       overflow:auto; padding:20px; z-index:1000;">
    <h2>Лабораторії у виділеній зоні</h2>
    <table id="modalTable" border="1" style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th>Контрагент</th>
          <th>Місто</th>
          <th>ЛПЗ</th>
          <th>ЄДРПОУ</th>
          <th>Менеджер</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="closeModal()">Закрити</button>
  </div>

  <!-- Модальне вікно закупівель -->
  <div id="purchasesModal" style="display:none; position:fixed; top:10%; left:10%; width:80%; height:70%; 
       background:#fff; color:#000; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.6); 
       overflow:auto; padding:20px; z-index:1000;">
    <button onclick="exportPurchasesToExcel()">Експорт закупівель</button>
    <button onclick="closePurchasesModal()">Закрити</button>
      <h2>Закупівлі за останні 90 днів</h2>
    <div id="purchasesSummary" style="margin-top:15px; font-weight:bold;"></div>
    <table id="purchasesTable">
  <thead>
    <tr>
      <th onclick="sortTable(0)">Лабораторія <span class="sort-icon"></span></th>
      <th onclick="sortTable(1)">Предмет <span class="sort-icon"></span></th>
      <th onclick="sortTable(2)">Кількість <span class="sort-icon"></span></th>
      <th onclick="sortTable(3)">Дата <span class="sort-icon"></span></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

    </div>

  <!-- Підключення спільних скриптів -->
  <script src="../shared/cache.js"></script>
  <script src="logistics.js"></script>
  <script src="labcards.js"></script>
</body>
</html>
