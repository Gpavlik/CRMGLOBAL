<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Картка лабораторії</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #006400, #004d00);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }
    h1 { margin-top: 30px; }
    form {
      max-width: 1200px;
      width: 95%;
      margin: 20px auto;
      padding: 20px;
      background: #008000;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      box-sizing: border-box;
    }
    form label { display: block; margin: 12px 0; }
    input {
      width: 100%; padding: 8px;
      border-radius: 6px; border: none;
      box-sizing: border-box;
    }
    .form-actions { margin-top: 20px; }
    .form-actions button, .back-btn {
      margin-right: 10px;
      background: #006400; color: white;
      border: none; cursor: pointer;
      padding: 10px 14px; border-radius: 6px;
      text-decoration: none;
      display: inline-block;
    }
    .form-actions button:hover, .back-btn:hover { background: #003300; }
    #map {
      margin-top: 20px;
      width: 100%;
      height: 300px;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #eee;
    }
    .device-block {
      background: #f0fff0;
      border: 2px solid #006400;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 100, 0, 0.2);
    }
    .device-block label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #004d00;
    }
    .device-block input,
    .device-block select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .device-selects {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .device-selects > div {
      flex: 1 1 45%;
    }
    .reagent-block,
    .analysis-block {
      background: #e6ffe6;
      border: 1px solid #99cc99;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .reagent-block label,
    .analysis-block label {
      font-weight: normal;
      color: #003300;
      margin-top: 0;
    }
    #devicesContainer button {
      background: #006400;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    #devicesContainer button:hover {
      background: #003300;
    }
    fieldset {
      border: 2px solid #006400;
      border-radius: 8px;
      padding: 12px;
      margin-top: 20px;
      background: #0bb10b;
    }
    legend {
      font-weight: bold;
      color: #004d00;
    }
  </style>
</head>
<body>
  <img src="../logo.svg" alt="logo" width="220">
  <h1>🧪 Картка лабораторії</h1>

  <form id="labForm">
    <!-- Основні поля -->
    <label>Назва партнера: <input type="text" id="partnerName" required></label>
    
    <label>Область: 
      <input type="text" id="region" list="regionList" onchange="fillCityOptions()" required>
      <datalist id="regionList"></datalist>
    </label>
    
    <label>Місто: 
      <input type="text" id="city" list="cityList" onchange="fillLpzOptions()" required>
      <datalist id="cityList"></datalist>
    </label>
    
    <label>ЛПЗ: 
      <input type="text" id="lpz" list="lpzList" onblur="prefillLabData()" required>
      <datalist id="lpzList"></datalist>
    </label>
    
    <label>Адреса: <input type="text" id="labAddress"></label>
    <label>Контрагент: <input type="text" id="contractor"></label>
    <label>Телефон: <input type="text" id="phone"></label>
    <label>ЄДРПОУ: <input type="text" id="labEdrpou"></label>
    <label>Менеджер: <input type="text" id="labManager"></label>

    <!-- Прилади (Секція прихована за замовчуванням) -->
    <section id="devicesSection" style="display: none;">
      <h2>🔧 Прилади</h2>
      <div id="devicesContainer"></div>
      <button type="button" onclick="addDevice()">➕ Додати прилад</button>
    </section>

    <!-- Прев’ю задач -->
    <div id="taskPreview"></div>

    <!-- Планування візиту -->
    <fieldset>
      <legend>📅 Планування візиту</legend>
      <label>Рекомендована дата візиту:
        <input type="date" id="recommendedVisitDate">
      </label>
      <button type="button" onclick="suggestVisitDate()">📅 Запропонувати дату</button>
    </fieldset>

    <!-- Дії -->
    <div class="form-actions">
      <button type="button" onclick="saveOrUpdateLabCard()">💾 Зберегти лабораторію</button>
      <a href="./labs.html" class="back-btn">⬅️ Назад</a>
    </div>
  </form>

  <!-- Підключаємо спільні скрипти -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="labcard.js"></script>
  <script src="logistics.js"></script>
</body>
</html>
