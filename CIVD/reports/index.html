<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧪 Звіти</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #006400, #004d00);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1, h2 {
      margin-top: 30px;
      text-align: center;
    }
    .dashboard {
      max-width: 1000px;
      width: 95%;
      margin: 20px auto;
      padding: 20px;
      background: #008000;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
    }
    input, select {
      padding: 6px;
      border: none;
      border-radius: 6px;
      margin-top: 4px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #006400;
      color: #ffffff;
      font-size: 0.9rem;
    }
    button:hover {
      background-color: #003300;
    }
    #reagentReport, #chartContainer, #trendChartContainer, #trendTableContainer {
      margin-top: 20px;
      background: #fff;
      color: #000;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="./report.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <img src="../logo.svg" alt="logo" width="560">
  <h2>📊 Звіти</h2>

  <div class="dashboard">
    <!-- Форма вибору періоду, реагенту, режиму та типу звіту -->
    <form onsubmit="event.preventDefault(); generateReport();">
      <label>Початок:
        <input type="date" id="startDate" required>
      </label>
      <label>Кінець:
        <input type="date" id="endDate" required>
      </label>
      <label>Реагент:
        <select id="reagentSelect">
          <option value="">Усі</option>
        </select>
      </label>
      <label>Режим:
        <select id="reportMode">
          <option value="simple">Звичайний</option>
          <option value="detailed">Детальний</option>
        </select>
      </label>
      <label>Тип звіту:
        <select id="reportType">
          <option value="forecast">Прогноз</option>
          <option value="needs">Потреба</option>
          <option value="facts">Факт</option>
        </select>
      </label>
      <button type="submit">🔍 Згенерувати звіт</button>
    </form>

    <div id="reagentReport"></div>

    <a href="../index.html"><button>📅 Назад</button></a>
    
    <div id="chartContainer"></div>
    <button onclick="buildTrendChart()">📈 Виконання</button>
    <div id="trendChartContainer"></div>
    <div id="trendTableContainer"></div>
  </div>
</body>
</html>
