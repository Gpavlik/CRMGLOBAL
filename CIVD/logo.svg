<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&amp;display=swap');
    
    .bg { fill: #0a0a0a; }
    
    .logo-text {
      font-family: 'Pacifico', cursive, sans-serif;
      font-size: 56px;
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .sub-logo-text {
      font-family: 'Pacifico', cursive, sans-serif;
      font-size: 16px;
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .dot {
      fill: #FFFFFF;
      animation-duration: 9s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    /* Рівний конвеєр на 9 кроків (крок 20px, загальна довжина шляху 160px) */
    @keyframes fixedCycle {
      0%   { transform: translate(30px, 14px); opacity: 1; }
      11.1% { transform: translate(50px, 14px); opacity: 1; }
      22.2% { transform: translate(70px, 14px); opacity: 1; }
      33.3% { transform: translate(90px, 14px); opacity: 1; }
      44.4% { transform: translate(110px, 14px); opacity: 1; }
      55.5% { transform: translate(130px, 14px); opacity: 1; }
      66.6% { transform: translate(150px, 14px); opacity: 1; }
      77.7% { transform: translate(170px, 14px); opacity: 1; }
      85%   { transform: translate(170px, 28px); opacity: 0.3; } /* плавно пірнає під рядок в кінці */
      92%   { transform: translate(30px, 28px); opacity: 0.3; }  /* летить наліво знизу */
      98%   { transform: translate(30px, 14px); opacity: 1; }   /* виринає на перше місце під "P" */
      100%  { transform: translate(30px, 14px); opacity: 1; }
    }

    /* Рівномірний розподіл затримок для 9 крапок з кроком в 1 секунду */
    .d1 { animation-name: fixedCycle; animation-delay: 0s; }
    .d2 { animation-name: fixedCycle; animation-delay: -1s; }
    .d3 { animation-name: fixedCycle; animation-delay: -2s; }
    .d4 { animation-name: fixedCycle; animation-delay: -3s; }
    .d5 { animation-name: fixedCycle; animation-delay: -4s; }
    .d6 { animation-name: fixedCycle; animation-delay: -5s; }
    .d7 { animation-name: fixedCycle; animation-delay: -6s; }
    .d8 { animation-name: fixedCycle; animation-delay: -7s; }
    .d9 { animation-name: fixedCycle; animation-delay: -8s; }
  </style>
  
  <rect width="100%" height="100%" class="bg"/>
  
  <!-- Текст логотипу -->
  <text x="300" y="75" class="logo-text">Pavloy</text>
  <text x="300" y="125" class="sub-logo-text">business-trainer</text>
  <!-- 9 крапок стартують рівно під літерою P (cx = 200) і накривають все слово -->
  <g transform="translate(0, 125)">
    <circle class="dot d1" cx="200" cy="0" r="2.5"/>
    <circle class="dot d2" cx="200" cy="0" r="2.5"/>
    <circle class="dot d3" cx="200" cy="0" r="2.5"/>
    <circle class="dot d4" cx="200" cy="0" r="2.5"/>
    <circle class="dot d5" cx="200" cy="0" r="2.5"/>
    <circle class="dot d6" cx="200" cy="0" r="2.5"/>
    <circle class="dot d7" cx="200" cy="0" r="2.5"/>
    <circle class="dot d8" cx="200" cy="0" r="2.5"/>
    <circle class="dot d9" cx="200" cy="0" r="2.5"/>
  </g>
</svg>
