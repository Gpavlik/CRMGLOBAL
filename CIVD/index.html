function showDashboard(role) {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("userRole").innerHTML =
    `✅ Ви увійшли як <b>${role}</b>`;
}

function showLogin() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
}

function isTokenValid(token) {
  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    return payload.exp * 1000 > Date.now();
  } catch {
    return false;
  }
}

// 🔎 Перевірка токена при завантаженні сторінки
window.onload = async () => {
  const savedToken = sessionStorage.getItem("token");
  if (savedToken && isTokenValid(savedToken)) {
    try {
      const res = await fetch("https://nodejs-production-7176.up.railway.app/labs", {
        headers: { "Authorization": "Bearer " + savedToken }
      });

      if (res.status === 403) {
        showLogin();
      } else {
        const payload = JSON.parse(atob(savedToken.split(".")[1]));
        showDashboard(payload.role);
        showProgress("✅ Токен валідний, ви увійшли як " + payload.role, "success");
      }
    } catch {
      showLogin();
    }
  } else {
    showLogin();
  }
};

function showProgress(message, type="info") {
  const box = document.getElementById("progressBox");
  const list = document.getElementById("progressList");
  box.style.display = "block";

  const li = document.createElement("li");
  li.textContent = message;

  switch (type) {

    case "info":

  }

  list.appendChild(li);
}

// === IndexedDB helpers ===
const DB_NAME = "labsDB";
const DB_VERSION = 3; // піднята версія
const LABS_STORE = "labs";
const VISITS_STORE = "visits";
const TASKS_STORE = "tasks";

// ==========================
// Ініціалізація IndexedDB
// ==========================
function initDB() {
  const request = indexedDB.open(DB_NAME, DB_VERSION);

  request.onupgradeneeded = (event) => {
    const db = event.target.result;
    console.log("onupgradeneeded fired, створюємо stores...");

    if (!db.objectStoreNames.contains(LABS_STORE)) {
      db.createObjectStore(LABS_STORE);
    }
    if (!db.objectStoreNames.contains(VISITS_STORE)) {
      db.createObjectStore(VISITS_STORE);
    }
    if (!db.objectStoreNames.contains(TASKS_STORE)) {
      db.createObjectStore(TASKS_STORE);
    }
  };

  request.onsuccess = () => {
    console.log("✅ IndexedDB ініціалізовано з labs, visits, tasks");
  };

  request.onerror = (err) => {
    console.error("❌ Помилка ініціалізації IndexedDB:", err);
  };
}

// ==========================
// Збереження масиву об'єктів
// ==========================
async function saveToDB(storeName, items) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onsuccess = (event) => {
      const db = event.target.result;
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);

      items.forEach(item => {
        if (!item.edrpou) {
          console.warn("Пропущено об’єкт без edrpou:", item);
          return;
        }
        store.put(item, item.edrpou); // ключ = edrpou
      });

      tx.oncomplete = () => resolve(true);
      tx.onerror = (err) => reject(err);
    };
    request.onerror = (err) => reject(err);
  });
}

// ==========================
// Читання
// ==========================
async function getAllFromDB(storeName) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onsuccess = (event) => {
      const db = event.target.result;
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const getRequest = store.getAll();

      getRequest.onsuccess = () => resolve(getRequest.result);
      getRequest.onerror = (err) => reject(err);
    };
    request.onerror = (err) => reject(err);
  });
}
// ==========================
// Маркер часу синхронізації
// ==========================
function getLastSync() {
  return parseInt(sessionStorage.getItem("lastSync") || "0", 10);
}
function setLastSync(timestamp) {
  sessionStorage.setItem("lastSync", timestamp.toString());
}

// ==========================
// Фетч змін з бекенду (дельта)
// ==========================
async function fetchLabsAndVisits() {
  const API_URL = "https://nodejs-production-7176.up.railway.app";
  const token = sessionStorage.getItem("token");
  const lastSync = getLastSync();

  try {
    let labsRes, visitsRes;

    if (lastSync === 0) {
      labsRes = await fetch(`${API_URL}/labs`, { headers: { "Authorization": "Bearer " + token } });
      visitsRes = await fetch(`${API_URL}/visits`, { headers: { "Authorization": "Bearer " + token } });
    } else {
      labsRes = await fetch(`${API_URL}/labs/changes?since=${lastSync}`, { headers: { "Authorization": "Bearer " + token } });
      visitsRes = await fetch(`${API_URL}/visits/changes?since=${lastSync}`, { headers: { "Authorization": "Bearer " + token } });
    }

    const labsRaw = await labsRes.json();
    const visitsRaw = await visitsRes.json();

    await saveToDB("labs", labsRaw);
    await saveToDB("visits", visitsRaw);

    setLastSync(Date.now());
    console.log("✅ Фетч завершено (дельта)");
    return { labs: labsRaw, visits: visitsRaw };
  } catch (err) {
    console.error("❌ Помилка при fetch:", err);
    return { labs: [], visits: [] };
  }
}

// ==========================
// Пуш змін на бекенд (дельта)
// ==========================
async function pushLabsAndVisits() {
  const API_URL = "https://nodejs-production-7176.up.railway.app";
  const token = sessionStorage.getItem("token");
  const lastSync = getLastSync();

  try {
    const labsUnified = await getAllFromDB("labs");
    const visits = await getAllFromDB("visits");

    const labsForBackend = labsUnified.filter(l => l.updatedAt && l.updatedAt > lastSync);
    const visitsForBackend = visits.filter(v => v.updatedAt && v.updatedAt > lastSync);

    await Promise.all([
      fetch(`${API_URL}/labs/update`, {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(labsForBackend)
      }),
      fetch(`${API_URL}/visits/update`, {
        method: "POST",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(visitsForBackend)
      })
    ]);

    setLastSync(Date.now());
    console.log("✅ Пуш завершено (дельта)");
  } catch (err) {
    console.error("❌ Помилка при push:", err);
  }
}

// ==========================
// Старт дня
// ==========================
async function startDay() {
  try {
    initDB(); // гарантуємо, що база створена
    const { labs, visits } = await fetchLabsAndVisits();
    console.log("✅ Дані завантажено у IndexedDB");

    renderLabs(labs);
    renderVisits(visits);

    showProgress("🌅 Робочий день розпочато!", "success");
  } catch (err) {
    console.error("❌ Помилка при старті дня:", err);
    showProgress("⚠️ Не вдалося розпочати день", "error");
  }
}

// ==========================
// Завершення дня
// ==========================
async function endDay() {
  showProgress("📤 Відправка локальних змін на бекенд...");
  updateProgress(0);

  try {
    for (let i = 0; i <= 50; i++) {
      updateProgress(i);
      await new Promise(r => setTimeout(r, 20));
    }

    await pushLabsAndVisits();

    for (let i = 51; i <= 100; i++) {
      updateProgress(i);
      await new Promise(r => setTimeout(r, 20));
    }

    showProgress("🌇 Зміни синхронізовано!", "success");
  } catch (err) {
    console.error("❌ Помилка при синхронізації:", err);
    showProgress("❌ Помилка при синхронізації", "error");
    updateProgress(0);
  }
}

// === трансформації даних ===

// Допоміжна функція для останніх реагентів
function getLatestReagentsInfo(allOrders) {
  const latestInfo = {};
  for (const order of allOrders) {
    const { reagentName, lastOrderDate, lastOrderCount } = order;
    if (
      !latestInfo[reagentName] ||
      new Date(lastOrderDate) > new Date(latestInfo[reagentName].lastOrderDate)
    ) {
      latestInfo[reagentName] = { lastOrderDate, lastOrderCount };
    }
  }
  return latestInfo;
}

// Трансформація з бекенду у локальний формат
function transformLabFromBackend(lab) {
  return {
    ...lab,
    updatedAt: lab.updatedAt || Date.now(), // гарантуємо наявність updatedAt
    devices: (lab.devices || []).map(d => {
      const reagentsOrders = (d.reagents || []).map(r => ({
        reagentName: r.name,
        lastOrderDate: r.date,
        lastOrderCount: r.quantity
      }));
      const reagentsInfo = getLatestReagentsInfo(reagentsOrders);
      return {
        ...d,
        reagentsOrders,
        reagentsInfo,
        analyses: d.analyses || {}
      };
    })
  };
}

// Зворотна трансформація у формат бекенду
function transformLabToBackend(lab) {
  return {
    ...lab,
    updatedAt: lab.updatedAt || Date.now(), // завжди додаємо мітку часу
    devices: (lab.devices || []).map(d => ({
      ...d,
      reagents: (d.reagentsOrders || []).map(r => ({
        name: r.reagentName,
        date: r.lastOrderDate,
        quantity: r.lastOrderCount
      }))
    }))
  };
}

// Прогресбар
function updateProgress(percent) {
  const bar = document.getElementById("progressBar");
  bar.style.width = percent + "%";
  bar.textContent = percent + "%";

  // плавний перехід кольору від червоного до зеленого
  const red = Math.max(0, 255 - Math.floor(percent * 2.55));
  const green = Math.min(255, Math.floor(percent * 2.55));
  bar.style.backgroundColor = `rgb(${red},${green},0)`;
}

// Симуляція завантаження
async function simulateLoading() {
  for (let i = 0; i <= 100; i++) {
    updateProgress(i);
    await new Promise(r => setTimeout(r, 50));
  }
}

// Очистка IndexedDB
async function clearIndexedDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.deleteDatabase("labsDB");

    request.onsuccess = () => {
      console.log("🧹 IndexedDB повністю очищено");
      resolve(true);
    };
    request.onerror = (event) => {
      console.error("❌ Помилка при видаленні IndexedDB:", event);
      reject(event);
    };
    request.onblocked = () => {
      console.warn("⚠️ Видалення заблоковано. Закрий інші вкладки з цією базою.");
    };
  });
}

function getLoginName() {
  const text = document.getElementById("userRole")?.textContent || "";
  const match = text.match(/як\s+(.+)/);
  return match ? match[1].trim() : "невідомий";
}

function submitPromoOrder() {
  const order = {};

  // збір по приладах
  document.querySelectorAll("#promoGrid .promo-item").forEach(div => {
    const dev = div.querySelector("h4").textContent;
    order[dev] = {};
    div.querySelectorAll("input[type='number']").forEach(inp => {
      if (inp.value > 0) {
        const type = inp.id.split("_").slice(2).join("_");
        order[dev][type] = inp.value;
      }
    });
  });

  // збір подарунків
  order["Подарунки"] = {};
  document.querySelectorAll("#giftGrid .promo-item").forEach(div => {
    const gift = div.querySelector("h4").textContent;
    const qty = div.querySelector("input[type='number']").value;
    const comment = div.querySelector("textarea").value;
    if (qty > 0) {
      order["Подарунки"][gift] = {quantity: qty, comment};
    }
  });

  // формуємо текст замовлення
  let orderText = "";
  Object.keys(order).forEach(section => {
    orderText += `\n${section}:\n`;
    Object.keys(order[section]).forEach(item => {
      const val = order[section][item];
      if (typeof val === "object") {
        orderText += `- ${item}: ${val.quantity} (${val.comment})\n`;
      } else {
        orderText += `- ${item}: ${val}\n`;
      }
    });
  });

  const login = getLoginName();

  // --- формуємо масив для Google Sheets ---
  const rows = [];
  Object.keys(order).forEach(section => {
    Object.keys(order[section]).forEach(item => {
      const val = order[section][item];
      rows.push({
        manager: login,
        type: section,
        name: item,
        quantity: typeof val === "object" ? val.quantity : val,
        comment: typeof val === "object" ? val.comment : ""
      });
    });
  });

  // один запит на всі рядки
  fetch("https://script.google.com/macros/s/AKfycby_-OwpYYAjDpKh0FkKio6fkD_pENWescMSnWyInx4orD8mkXkQegKNVAT8jsxfVt2W/exec", {
    method: "POST",

    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(rows)
  })
  .then(r => r.text())
  .then(txt => console.log("Записано у Sheets:", txt))
  .catch(err => console.error("Помилка запису:", err));

  // --- формування листа ---
  const now = new Date();
  const monthNames = [
    "січень","лютий","березень","квітень","травень","червень",
    "липень","серпень","вересень","жовтень","листопад","грудень"
  ];
  const month = monthNames[now.getMonth()];
  const year = now.getFullYear();

  const mailBody = encodeURIComponent(
    `Добрий день, шановний адміністраторе!\n` +
    `Надсилаю Вам замовлення промо на ${month} ${year}.\n\n` +
    `${orderText}\n` +
    `З повагою,\n${login} менеджер`
  );

  const subject = encodeURIComponent(`Замовлення промо для ${login}`);

  window.location.href = `mailto:oplevish66@gmail.com?subject=${subject}&body=${mailBody}`;
  closePromoModal();
}

async function clearLabs() {

async function syncLabsAndVisits() {
  // беремо токен із sessionStorage
  const token = sessionStorage.getItem("token");

  if (!token) {
    console.error("❌ Немає токена у sessionStorage. Спочатку залогінься!");
    return;
  }

  try {
    // тягнемо дані з бекенду
    const labsResp = await fetch("https://nodejs-production-7176.up.railway.app/labs/all", {
      headers: { "Authorization": "Bearer " + token }
    });
    const labs = await labsResp.json();

    const visitsResp = await fetch("https://nodejs-production-7176.up.railway.app/visits/all", {
      headers: { "Authorization": "Bearer " + token }
    });
    const visits = await visitsResp.json();

    // відкриваємо IndexedDB (labsDB, версія 3)
    const request = indexedDB.open("labsDB", 3);
    request.onupgradeneeded = function(event) {
      const db = event.target.result;
      if (!db.objectStoreNames.contains("labs")) {
        db.createObjectStore("labs", { keyPath: "_id" });
      }
      if (!db.objectStoreNames.contains("visits")) {
        db.createObjectStore("visits", { keyPath: "_id" });
      }
    };

    request.onsuccess = function(event) {
      const db = event.target.result;

      // очищаємо і записуємо
      const labsStore = db.transaction("labs", "readwrite").objectStore("labs");
      labsStore.clear();
      labs.forEach(lab => labsStore.put(lab));

      const visitsStore = db.transaction("visits", "readwrite").objectStore("visits");
      visitsStore.clear();
      visits.forEach(visit => visitsStore.put(visit));

      console.log(`✅ Синхронізовано: ${labs.length} лабораторій, ${visits.length} візитів`);
    };

    request.onerror = function(event) {
      console.error("❌ Помилка відкриття IndexedDB:", event.target.errorCode);
    };
  } catch (err) {
    console.error("❌ Помилка синхронізації:", err);
  }
}

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("labsDB", 3);

    request.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("labs")) {
        db.createObjectStore("labs", { keyPath: "edrpou" });
      }
      if (!db.objectStoreNames.contains("visits")) {
        db.createObjectStore("visits", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("tasks")) {
        db.createObjectStore("tasks", { keyPath: "id" });
      }
    };

    request.onsuccess = e => resolve(e.target.result);
    request.onerror = e => reject(e.target.error);
  });
}

async function insertLabsGeocoded(jsonData) {
  const db = await openDB("labsDB", 3); // твоя IndexedDB
  const tx = db.transaction("labs", "readwrite");
  const store = tx.objectStore("labs");

  jsonData.forEach(item => {
    item.updatedAt = Date.now(); // щоб pushLabsAndVisits підхопив
    store.put(item);
  });

  await tx.done;
  console.log("✅ labs_geocoded.json вставлено в IndexedDB");
}
