<html lang="uk">
<head>

  <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/main.min.css" rel="stylesheet">

  <style> 
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #009400, #004d00); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    .header-controls { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; }

    #dashboardBtn { background: #64748b; } #dashboardBtn:hover { background: #475569; }
    #calendar { width: 92%; margin: 30px auto; padding: 20px; border-radius: 16px; background: rgba(254, 254, 254, 0.92) !important; backdrop-filter: blur(10px); box-shadow: 0 15px 35px rgba(0, 45, 0, 0.2); color: #1e293b !important; }
    .fc { color: #1e293b !important; }
    .fc a { color: #1e293b !important; text-decoration: none; font-weight: 600; }
    .fc-theme-standard td, .fc-theme-standard th { border: 1px solid #cbd5e1 !important; }
    .fc-col-header-cell { background: #f8fafc; padding: 8px 0 !important; }
    .fc-v-event { border: 1px solid rgba(255,255,255,0.3) !important; border-radius: 6px !important; padding: 4px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.08) !important; }
    .fc-timegrid-slot { height: 35px !important; min-height: 35px !important; }

    .modal-box h3 { margin: 0 0 10px 0; font-size: 18px; color: #004d00; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .modal-box label { font-size: 13px; font-weight: 700; color: #475569; margin-bottom: -8px; }
    .modal-box input, .modal-box select, .modal-box textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 14px; }
    .modal-box textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-cancel { background: #94a3b8; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600;}
    .btn-submit { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600;}
    .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600;}
    .btn-duplicate { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600;}
    @media screen and (max-width: 1024px) { header { flex-direction: column; gap: 12px; padding: 15px; text-align: center; } .header-controls { flex-direction: column; width: 100%; gap: 8px; } .header-controls select, header button { width: 100% !important; } #calendar { width: 98%; padding: 10px; margin: 15px auto; } }

#savingOverlay {
  transition: opacity 0.3s ease;
}
 </style>

<body>

  <header>
    <h1>Календар задач</h1>
    <div id="userInfoTop" class="user-info"></div>
    <div class="header-controls">
      <label for="processSelector">📂 Процес:</label>
      <select id="processSelector"></select>

      <label for="userFilterSelector" id="userFilterLabel" style="display: none;">👥 Учасник:</label>
      <select id="userFilterSelector" style="display: none;">
        <option value="all">Всі користувачі</option>
      </select>

      <button id="saveBtn">Зберегти зміни</button>
      <button id="dashboardBtn" onclick="window.location.href='Dashboard.html'">На Dashboard</button>
    </div>
  </header>

  <div id="calendar"></div>

  <div id="createModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Створити нову задачу</h3>
      <label>Процес:</label>
      <select id="modalProcess"></select>
      <label>Назва задачі:</label>
      <input type="text" id="modalTaskTitle" placeholder="Коротко про задачу...">
      <label>Виконавець:</label>
      <select id="modalUser"></select>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('createModal')">Скасувати</button>
        <button class="btn-submit" onclick="saveNewTask()">Створити</button>
      </div>
    </div>
  </div>

  <div id="actionModal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="actionModalTitle">Редагування задачі</h3>
      <label>Коментар / Чат:</label>
      <textarea id="modalComment" placeholder="Додайте коментар..."></textarea>
      <button class="btn-submit" style="width: 100%;" onclick="saveTaskComment()">Зберегти коментар</button>
      <div style="border-top: 1px solid #e2e8f0; margin: 10px 0;"></div>
      <div class="modal-actions" style="justify-content: space-between;">
        <button class="btn-delete" onclick="deleteTask()">🗑 Видалити</button>
        <div style="display: flex; gap: 10px;">
          <button class="btn-cancel" onclick="closeModal('actionModal')">Закрити</button>
          <button class="btn-duplicate" onclick="duplicateTask()">⧉ Дублювати</button>
        </div>
      </div>
    </div>
  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbza4BsXaFsshDko_sxQf6imA4mOvrYexOOheuAHkxxOh3tD6vPtemnIJMz7GH0hJQ5X/exec";
const PROCESSES_SHEET_URL = "https://docs.google.com/spreadsheets/d/1vjxURM8HlNTxdk-XGEh-99sYuHhtEgNKLf-39jRm8-Q/gviz/tq?tqx=out:json&sheet=Processes";

const currentUser = sessionStorage.getItem("currentUser") || "невідомий";
const usersMap = {
  gala: "Галина Кузнєцова", olenka: "Олена Поліщук", dima: "Дмитро Приходько",
  serega: "Сергій Комашко", sasha: "Олександр Волянюк", pasha: "Павло Гриценко",
  anya: "Ганна Мойсеєнко", tetiana: "Тетяна Яковець", adminp: "Адмін"
};

document.getElementById("userInfoTop").innerHTML = `<span>👤 Користувач: ${usersMap[currentUser] || currentUser}</span>`;

let globalTasks = []; 
let currentCalendar = null; 

let tempEventStart = null;
let tempEventEnd = null;
let activeTaskId = null;

function normalizeUser(userKeyOrName) {
  if (usersMap[userKeyOrName]) return userKeyOrName;
  return Object.keys(usersMap).find(k => usersMap[k] === userKeyOrName) || userKeyOrName;
}

function toLocalISOString(date) {
  const tzOffset = date.getTimezoneOffset() * 60000; 
  return (new Date(date.getTime() - tzOffset)).toISOString().slice(0, 19);
}
function showSavingLoader() {
  const overlay = document.getElementById("savingOverlay");
  overlay.style.display = "flex";
  overlay.style.opacity = "0";
  overlay.classList.add("fade-in");
  overlay.style.opacity = "1";
}

function hideSavingLoader() {
  const overlay = document.getElementById("savingOverlay");
  overlay.classList.add("fade-out");
  setTimeout(() => overlay.style.display = "none", 800);
}
// --- 1. ЗАВАНТАЖЕННЯ ---
async function loadProcesses() {
  const res = await fetch(PROCESSES_SHEET_URL);
  const text = await res.text();
  const match = text.match(/google.visualization.Query.setResponse\(([\s\S]*)\);/);
  if (!match) return [];
  const json = JSON.parse(match[1]);
  
  return json.table.rows.map(r => {
    // r.c - це масив комірок. Кожна клітинка виглядає як {v: "значення", f: "формат"}
    // Ми беремо .v (значення), а якщо клітинка порожня - ставимо ""
    const c = r.c.map(cell => (cell && cell.v !== null ? cell.v : ""));
    
    return {
      processID: String(c[0]), 
      title: String(c[1]), 
      owner: String(c[2]), 
      participants: c[3] ? String(c[3]).split(", ") : [],
      statusProc: String(c[4]), 
      taskID: String(c[5]), // ID
      taskTitle: String(c[6]), // Назва
      start: String(c[7]), 
      deadline: String(c[8]), 
      role: String(c[9]), 
      username: String(c[10]),
      multiRole: String(c[11]) === "TRUE", 
      dependency: String(c[12]), 
      priority: String(c[13]),
      files: String(c[14]), 
      chat: String(c[15]), 
      statusTask: String(c[16])
    };
  }).filter(t => t.taskID && t.taskID !== ""); // Фільтруємо пусті рядки
}

function filterProcessesByAccess(tasks, currentUserName) {
  if (currentUserName === "Адмін") return tasks;
  if (["Галина Кузнєцова", "Павло Гриценко"].includes(currentUserName)) {
    return tasks.filter(t => t.owner === currentUserName || (t.participants || []).some(part => part.includes(currentUserName)));
  }
  return tasks.filter(t => t.username?.includes(currentUserName));
}

// --- 2. ФІЗИЧНЕ РОЗБИТТЯ БАГАТОДЕННИХ ЗАДАЧ ТА АВТО-СЛОТИ ---
function explodeTasks(rawTasks) {
  let exploded = [];
  let occupiedSlots = {};

  function getFreeHour(dayStr) {
    if (!occupiedSlots[dayStr]) occupiedSlots[dayStr] = [];
    let h = 8;
    while (occupiedSlots[dayStr].includes(h) && h < 20) h++;
    if (h >= 20) h = 19;
    occupiedSlots[dayStr].push(h);
    return h;
  }

  rawTasks.forEach(t => {
    // 🔥 КРИТИЧНА ПРАВКА: Якщо ID вже містить дату, значить задача вже розбита.
    // Ми її не розбиваємо, просто додаємо як є.
    const isAlreadyExploded = t.taskID.includes("_20"); 
    
    if (isAlreadyExploded || !t.start) {
      exploded.push(t);
      return;
    }

    let sDate = new Date(t.start);
    let eDate = t.deadline ? new Date(t.deadline) : new Date(t.start);

    if (eDate.getHours() === 0 && eDate.getMinutes() === 0 && eDate.getTime() > sDate.getTime()) {
      eDate = new Date(eDate.getTime() - 1);
    }

    let currentDay = new Date(sDate.getFullYear(), sDate.getMonth(), sDate.getDate());
    let finalDay = new Date(eDate.getFullYear(), eDate.getMonth(), eDate.getDate());
    const isMultiDay = currentDay.getTime() !== finalDay.getTime();

    while (currentDay <= finalDay) {
      let clone = JSON.parse(JSON.stringify(t));
      const dayStr = toLocalISOString(currentDay).split("T")[0];
      
      clone.baseTaskID = clone.taskID; // Зберігаємо оригінал як базу
      
      // Додаємо суфікс дати для унікальності фрагмента
      clone.taskID = clone.taskID + "_" + dayStr;

      if (isMultiDay || clone.start.length <= 10) {
        let h = getFreeHour(dayStr);
        clone.start = `${dayStr}T${String(h).padStart(2,'0')}:00:00`;
        clone.deadline = `${dayStr}T${String(h+1).padStart(2,'0')}:00:00`;
      }

      exploded.push(clone);
      currentDay.setDate(currentDay.getDate() + 1);
    }
  });
  return exploded;
}

// --- 3. ПІДГОТОВКА ДЛЯ КАЛЕНДАРЯ (Тепер всі задачі одноденні) ---
// --- ПІДГОТОВКА ДЛЯ КАЛЕНДАРЯ (З розумними кольорами) ---
function processEventsForCalendar(tasks) {
  const today = new Date(); 
  today.setHours(0,0,0,0);

  // 1. Знаходимо максимальний дедлайн для кожної серії задач
  const maxDeadlines = {};
  tasks.forEach(t => {
    const baseId = String(t.taskID).split("_")[0]; // Отримуємо TASK-123 з TASK-123_2026-06-18
    const tDead = new Date(t.deadline).getTime();
    if (!maxDeadlines[baseId] || tDead > maxDeadlines[baseId]) {
      maxDeadlines[baseId] = tDead;
    }
  });

  return tasks.map(t => {
    let color;
    const s = String(t.statusTask || t.statusProc || "").toLowerCase().trim();
    const baseId = String(t.taskID).split("_")[0];
    
    // Беремо фінальний дедлайн всього ланцюжка
    const globalDeadlineObj = new Date(maxDeadlines[baseId]); 

    if (["done", "виконано", "completed"].includes(s)) color = "#10b981"; 
    else if (today > globalDeadlineObj) color = "#ef4444"; // Червоніє ТІЛЬКИ коли сплине остання
    else if (["inprogress", "в процесі", "progress"].includes(s)) color = "#f59e0b"; 
    else if (["todo", "зробити"].includes(s)) color = "#3b82f6"; 
    else color = "#8b5cf6"; 

    return {
      id: t.taskID,
      title: `${t.username || "невідомий"} — ${t.taskTitle || t.title}`,
      start: t.start,
      end: t.deadline,
      backgroundColor: color,
      textColor: "#ffffff",
      extendedProps: { ...t }
    };
  });
}

function eventContent(arg) {
  const start = arg.event.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const end = arg.event.end ? arg.event.end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
  return {
    html: `
      <div style="font-size:11px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,0.2); line-height:1.2; overflow:hidden; text-overflow:ellipsis;">
        ${start} - ${end} — ${arg.event.extendedProps.taskTitle || arg.event.extendedProps.title || ""}
      </div>
      <div style="font-size:10px; opacity:0.9; font-weight:500; margin-top:2px;">
        👤 ${arg.event.extendedProps.username || "невідомий"}
      </div>
    `
  };
}

// --- Оновлення часу (Після перетягування / розтягування) ---
function updateTaskTime(calendarEvent) {
  const task = globalTasks.find(t => String(t.taskID) === String(calendarEvent.id));
  if (task) {
    task.start = toLocalISOString(calendarEvent.start);
    if (calendarEvent.end) {
      task.deadline = toLocalISOString(calendarEvent.end);
    } else {
      let d = new Date(calendarEvent.start);
      d.setHours(d.getHours() + 1);
      task.deadline = toLocalISOString(d);
    }
  }
}

// --- Фільтри ---
function setupProcessSelector() {
  const selector = document.getElementById("processSelector");
  const uniqueProcesses = [...new Set(globalTasks.map(t => t.title).filter(Boolean))];
  selector.innerHTML = `<option value="all">Всі процеси</option>` + uniqueProcesses.map(p => `<option value="${p}">${p}</option>`).join("");
  selector.addEventListener("change", applyCombinedFilters);
}

function populateUserFilterSelector() {
  const filterSel = document.getElementById("userFilterSelector");
  filterSel.innerHTML = '<option value="all">Всі користувачі</option>';
  Object.entries(usersMap).forEach(([key, name]) => {
    filterSel.innerHTML += `<option value="${name}">${name}</option>`;
  });
  filterSel.addEventListener("change", applyCombinedFilters);
}

function applyCombinedFilters() {
  if (!currentCalendar) return;
  const selectedProcess = document.getElementById("processSelector").value;
  const selectedUser = document.getElementById("userFilterSelector").value;

  let filtered = globalTasks;
  if (selectedProcess !== "all") filtered = filtered.filter(t => t.title === selectedProcess);
  if (selectedUser && selectedUser !== "all") filtered = filtered.filter(t => t.username === selectedUser);

  const events = processEventsForCalendar(filtered);
  currentCalendar.removeAllEvents();
  currentCalendar.addEventSource(events);
}

// ================== МОДАЛЬНІ ВІКНА ==================

function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

// Клік по порожньому місцю (Створення)
function handleDateSelect(info) {
  tempEventStart = info.start;
  tempEventEnd = info.end;

  const pSelect = document.getElementById("modalProcess");
  const uniqueProcesses = [...new Set(globalTasks.map(t => t.title).filter(Boolean))];
  pSelect.innerHTML = uniqueProcesses.map(p => `<option value="${p}">${p}</option>`).join("");

  const uSelect = document.getElementById("modalUser");
  uSelect.innerHTML = Object.values(usersMap).map(u => `<option value="${u}">${u}</option>`).join("");
  uSelect.value = usersMap[currentUser] || currentUser; 

  document.getElementById("modalTaskTitle").value = "";
  openModal('createModal');
}

// Збереження нової задачі (з прив'язкою до існуючого процесу)
function saveNewTask() {
  const processTitle = document.getElementById("modalProcess").value;
  const title = document.getElementById("modalTaskTitle").value || "Нова задача";
  const user = document.getElementById("modalUser").value;
  const baseId = "TASK-" + Date.now();

  // 1. ШУКАЄМО СПРАВЖНІЙ PROCESS ID ТА ДАНІ ПРОЦЕСУ
  const existingTask = globalTasks.find(t => t.title === processTitle);
  const actualProcessID = existingTask ? existingTask.processID : Date.now().toString();
  const actualOwner = existingTask ? existingTask.owner : (usersMap[currentUser] || currentUser);
  const actualParticipants = existingTask ? existingTask.participants : [];

  const newTask = {
    processID: actualProcessID, // Більше ніяких "NEW"
    title: processTitle, 
    owner: actualOwner,
    participants: actualParticipants, 
    statusProc: existingTask ? existingTask.statusProc : "В процесі", 
    taskID: baseId, // Даємо чистий ID, Календар сам його розіб'є, якщо треба
    taskTitle: title,
    start: toLocalISOString(tempEventStart), 
    deadline: toLocalISOString(tempEventEnd), 
    role: "executor", 
    username: user, 
    statusTask: "todo", 
    chat: ""
  };

  globalTasks.push(newTask);
  globalTasks = explodeTasks(globalTasks);
  
  applyCombinedFilters();
  closeModal('createModal');
}

// Клік по існуючій події
function handleEventClick(info) {
  activeTaskId = info.event.id;
  const task = globalTasks.find(t => String(t.taskID) === String(activeTaskId));
  
  if(task) {
    document.getElementById("actionModalTitle").innerText = task.taskTitle || task.title;
    document.getElementById("modalComment").value = task.chat || "";
    openModal('actionModal');
  }
}

function saveTaskComment() {
  const task = globalTasks.find(t => String(t.taskID) === String(activeTaskId));
  if(task) {
    task.chat = document.getElementById("modalComment").value;
    alert("Коментар збережено локально. Натисніть 'Зберегти зміни' в шапці.");
    closeModal('actionModal');
  }
}

function deleteTask() {
  if(confirm("Ви дійсно хочете видалити цю задачу?")) {
    globalTasks = globalTasks.filter(t => String(t.taskID) !== String(activeTaskId));
    applyCombinedFilters();
    closeModal('actionModal');
  }
}

function duplicateTask() {
  const original = globalTasks.find(t => String(t.taskID) === String(activeTaskId));
  if(original) {
    const clone = JSON.parse(JSON.stringify(original));
    clone.taskID = "TASK-" + Date.now() + "_" + clone.start.split("T")[0]; // Унікальний ID
    
    // Зсуваємо на 1 годину вперед
    let startD = new Date(clone.start);
    let endD = new Date(clone.deadline);
    startD.setHours(startD.getHours() + 1);
    endD.setHours(endD.getHours() + 1);
    
    clone.start = toLocalISOString(startD);
    clone.deadline = toLocalISOString(endD);
    clone.taskTitle = clone.taskTitle + " (Копія)";

    globalTasks.push(clone);
    applyCombinedFilters();
    closeModal('actionModal');
  }
}

// --- Головний старт ---
document.addEventListener("DOMContentLoaded", async function() {
  try {
    let rawTasks = await loadProcesses();
    const currentName = usersMap[currentUser] || currentUser;
    
    rawTasks = filterProcessesByAccess(rawTasks, currentName);
    
    // ОДРАЗУ РОЗБИВАЄМО БАГАТОДЕННІ НА ОКРЕМІ ДНІ
    globalTasks = explodeTasks(rawTasks); 

    const currentKey = normalizeUser(currentUser);
    if (["adminp", "gala", "pasha"].includes(currentKey)) {
      populateUserFilterSelector();
      document.getElementById("userFilterLabel").style.display = "inline-block";
      document.getElementById("userFilterSelector").style.display = "inline-block";
    }

    const events = processEventsForCalendar(globalTasks);
    const calendarEl = document.getElementById("calendar");
    
    currentCalendar = new FullCalendar.Calendar(calendarEl, {
      locale: "uk",
      initialView: "timeGridWeek",
      slotMinTime: "08:00:00", slotMaxTime: "18:00:00",
      hiddenDays: [0,6], 
      
      editable: true,
      eventDurationEditable: true, 
      selectable: true, 
      
      expandRows: true, height: "auto", slotDuration: "00:30:00",
      slotLabelFormat: { hour: "2-digit", minute: "2-digit", hour12: false },
      headerToolbar: { left: "prev,next today", center: "title", right: "timeGridDay,timeGridWeek,dayGridMonth" },
      eventContent: eventContent,
      events: events,
      
      eventDrop: function(info) { updateTaskTime(info.event); },
      eventResize: function(info) { updateTaskTime(info.event); },
      select: function(info) { handleDateSelect(info); },
      eventClick: function(info) { handleEventClick(info); }
    });

    currentCalendar.render();
    setupProcessSelector();

document.getElementById("saveBtn").addEventListener("click", () => {
  // 1. Пошук кнопки та нашого оверлея
  const btn = document.getElementById("saveBtn");
  const overlay = document.getElementById("savingOverlay"); // Той самий div, що ми додали раніше
  
  // 2. Блокуємо кнопку та показуємо лоадер
  btn.disabled = true;
  btn.innerText = "Зберігаю...";
  overlay.style.display = "flex"; // Показуємо "Зберігаємо дані..."
  
  console.log("=== ДАНІ ДЛЯ ЗБЕРЕЖЕННЯ ===");
  console.log("Кількість задач:", globalTasks.length);
  
  const invalidTasks = globalTasks.filter(t => !t.processID || t.processID === "undefined");
  if (invalidTasks.length > 0) {
    console.warn("УВАГА! Знайдено задачі без ProcessID!", invalidTasks);
  }

  // 3. Запит
  fetch(SCRIPT_URL, {
    method: "POST", 
    mode: "no-cors", 
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ action: "updateCalendar", processes: globalTasks })
  })
  .then(() => {
    alert("Зміни успішно надіслані!");
  })
  .catch(err => {
    console.error(err);
    alert("Помилка при збереженні: " + err);
  })
  .finally(() => {
    // 4. Повертаємо все як було у будь-якому випадку
    btn.disabled = false;
    btn.innerText = "Зберегти зміни";
    overlay.style.display = "none";
  });
});

  } catch (error) {
    console.error("Помилка при завантаженні даних:", error);
    alert("Не вдалося завантажити дані. Спробуйте оновити сторінку.");
  }
});
</script>
