<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Oleo+Script:wght@700&amp;family=Yellowtail&amp;family=Montserrat:wght@700&amp;display=swap');
            
            .amp-text {
                font-family: 'Oleo Script', cursive;
                font-size: 110px;
                fill: #ffffff;
                paint-order: stroke fill;
                stroke: #111111;
                stroke-width: 22px;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            
            .sub-text {
                font-family: 'Yellowtail', cursive;
                font-size: 32px;
                fill: #ffffff;
                paint-order: stroke fill;
                stroke: #111111;
                stroke-width: 10px;
                stroke-linejoin: round;
                stroke-linecap: round;
            }
            
            .amp-vent {
                fill: none;
                stroke: #ffffff;
                stroke-width: 10;
                stroke-linecap: round;
            }
            
            .amp-chassis {
                fill: none;
                stroke: #ffffff;
            }

            .ui-text {
                font-family: 'Montserrat', sans-serif;
                font-weight: 700;
                font-size: 11px;
                fill: #ffffff;
                letter-spacing: 2px;
            }
        </style>

        <g id="screw-white">
            <circle cx="0" cy="0" r="7" fill="#111111" stroke="#ffffff" stroke-width="2.5"></circle>
            <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></line>
            <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></line>
        </g>
    </defs>

    <!-- Темний фон, щоб білий логотип ідеально контрастував і читався 
    <rect width="100%" height="100%" fill="#111111"></rect>-->
    
    <!-- Зовнішня кромка корпусу -->
    <rect x="10" y="10" width="580" height="280" rx="20" class="amp-chassis" stroke-width="6"></rect>
    
    <!-- Внутрішня лицьова панель -->
    <rect x="25" y="25" width="550" height="250" rx="8" class="amp-chassis" stroke-width="2"></rect>
    
    <!-- Гвинти -->
    <use href="#screw-white" x="45" y="45"></use>
    <use href="#screw-white" x="555" y="45"></use>
    <use href="#screw-white" x="45" y="255"></use>
    <use href="#screw-white" x="555" y="255"></use>

    <!-- Вентиляційні прорізи (крила) -->
    <path d="M 110 75 L 490 75" class="amp-vent"></path>
    <path d="M 125 105 L 475 105" class="amp-vent"></path>
    <path d="M 140 135 L 460 135" class="amp-vent"></path>
    <path d="M 155 165 L 445 165" class="amp-vent"></path>
    <path d="M 175 195 L 425 195" class="amp-vent"></path>

    <!-- Типографіка (білий колір шильдика) -->
    <g transform="rotate(-8 300 145)">
        <text x="300" y="150" text-anchor="middle" class="amp-text">Pavlo</text>
        <text x="300" y="195" text-anchor="middle" class="sub-text">Business Trainer &amp; HRBP</text>
    </g>

    <!-- Елементи керування (INPUT / MASTER) -->
    <g transform="translate(110, 230)">
        <text x="0" y="-22" text-anchor="middle" class="ui-text">INPUT</text>
        <circle cx="0" cy="0" r="14" fill="#111111" stroke="#ffffff" stroke-width="3"></circle>
        <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="1"></circle>
        <circle cx="0" cy="0" r="6" fill="#ffffff"></circle>
    </g>

    <g transform="translate(490, 230)">
        <text x="0" y="-22" text-anchor="middle" class="ui-text">MASTER</text>
        <circle cx="0" cy="0" r="15" fill="#111111" stroke="#ffffff" stroke-width="3"></circle>
        <circle cx="0" cy="0" r="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 3"></circle>
        <line x1="0" y1="0" x2="9" y2="-9" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"></line>
    </g>

</svg>