name: Deploy to MiroHost

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: vs2877.mirohost.net
          username: pharmvisit
          password: ${{ secrets.MIROHOST_PASS }}
          port: 21
          local-dir: build
          server-dir: /var/www/pharmvisit
