<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpg" href="11.png">
  <title>Вхід — Оберіть напрямок</title>
  <style>
    /* ==========================================================================
       1. ГЛОБАЛЬНІ СТИЛІ ТА БЕКГРАУНД
       ========================================================================== */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; 
      padding: 0;
      background: linear-gradient(135deg, #009400, #004d00);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 40px 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      margin: 15px 0 30px 0; 
      font-size: 16px; 
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    /* ==========================================================================
       2. PREMIUM GLASSMORPHISM ПЛИТКИ
       ========================================================================== */
    .units {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .unit {  
      height: 140px;
      width: 250px;
      /* 💧 Ефект матового аквамаринового скла */
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      
      /* Елегантний тонкий білий бордюр */
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      border-radius: 24px !important;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      overflow: hidden;
      cursor: pointer;
      /* Внутрішнє глянцеве свічення */
      box-shadow: 
        0 10px 25px rgba(0, 45, 0, 0.15),
        inset 2px 2px 5px rgba(255, 255, 255, 0.2) !important;
        
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .unit a {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    /* Стилізація твоїх картинок-логотипів */
    .unit img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ідеально вписує картинку без деформацій */
      border-radius: 23px; /* Трохи менше за unit, щоб не вилазило */
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* 🔥 ХОВЕР ЕФЕКТИ: Плитка оживає */
    .unit:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: rgba(255, 255, 255, 0.45) !important;
      box-shadow: 
        0 15px 35px rgba(0, 35, 0, 0.25),
        inset 3px 3px 6px rgba(255, 255, 255, 0.35) !important;
    }

    .unit:hover img {
      transform: scale(1.02);
      opacity: 1; /* Картинка стає на 100% чіткою */
    }

    /* ==========================================================================
       3. АДАПТИВНІСТЬ ТА АДАПТАЦІЯ ПІД МОБІЛЬНІ (APK / Смартфони)
       ========================================================================== */
    
    /* 📱 Mobile (Смартфони) */
    @media screen and (max-width: 540px) {
      body {
        padding: 30px 10px;
      }
      .units {
        flex-direction: column;
        gap: 20px;
      }
      .unit {
        width: 250px;
        height: 120px;
      }
    }

    /* 📲 Tablet (Планшети) */
    @media screen and (min-width: 541px) and (max-width: 1023px) {
      .units {
        gap: 20px;
      }
      .unit {
        width: 200px;
        height: 100px;
      }
    }
  </style>
</head>
<body>

  <h1>Вхід</h1>
  <img src="./logo.svg" alt="logo" width="240" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));">
  <div class="subtitle">Оберіть свій напрямок</div>

  <div class="units">
    <div class="unit"><a href="./can/index.html"><img src="./H2.png" alt="Head Office"></a></div>
    <div class="unit"><a href="./crmkrio/index.html"><img src="./M3.png" alt="Pain Relief"></a></div>
    <div class="unit"><a href="./crmph/index.html"><img src="./A4.png" alt="Pharmacy"></a></div>
    <div class="unit"><a href="./CIVD/index.html"><img src="./L1.png" alt="In Vitro Diagnostic"></a></div>
    <div class="unit"><a href="./crmkrio/warehouse.html"><img src="./W5.jfif" alt="Warehouse"></a></div>
  </div>

</body>
</html>
