<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpg" href="11.png">
  <title>Вхід</title>
  <style>
   body {
  font-family: Arial, sans-serif;
  margin: 0; padding: 0;
  background: linear-gradient(135deg, #009400, #004d00);
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.unit {  
  height: 250px;
  width: 250px;
  border: 2px solid #ffffff;
  border-radius: 30px;
  padding: 5px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  margin: 10px;
}
/*a {
  text-decoration: none;
  color: #ffffff;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border-radius: 40px;
}*/

.unit:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
}

/* 📱 Mobile (до 767px) */
@media screen and (max-width: 767px) {
  body {
    padding: 20px;
  }
  div {
    width: 100%;
    max-width: 400px;
  }
  .units {
    flex-direction: column;
    gap: 20px;
  }
  /*.unit{
    display: block;
    width: 100%;
    text-align: center;
  }*/
  img {
    width: 100%;
    height: 100%;
    max-width: 300px;
  }
}

/* 📲 Tablet (768px–1023px) */
@media screen and (min-width: 768px) and (max-width: 1023px) {
  .units {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-evenly;
    align-items: center;
    gap: 30px;
  }
  img {

    transition: transform 0.3s ease;
  }
}

/* 💻 Desktop (≥1024px) */
@media screen and (min-width: 1024px) {
  .units {
    display: flex;
    gap: 40px;
    justify-content: space-evenly;
    align-items: center;
  }
  img {
    
    transition: transform 0.3s ease;
  }
}

    </style>
</head>
<body>

  <img src="./logo.svg" alt="logo" width="260">
  <div style="margin: 20px 0; font-size: 18px;">Оберіть свій напрямок</div>
  <div class="units">
  <div class="unit"><a href="./can/index.html"><img src="./ho.png" alt="logo" width="250" height="250"></a></div>
  <div class="unit"><a href="./crmkrio/index.html"><img src="./cr.png" alt="logo" width="250" height="250"></a></div>
  <div class="unit"><a href="./crmph/index.html"><img src="./ap.png" alt="logo" width="250" height="250"></a></div>
  <div class="unit"><a href="index.html"><img src="./lab.png" alt="logo" width="250" height="250"></a></div>
</div>

</body>
</html>
